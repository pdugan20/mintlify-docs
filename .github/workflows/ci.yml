name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run claudelint
        run: npx claudelint check-all

      - name: Run markdownlint
        run: npx markdownlint-cli2

      - name: Validate plugin (strict)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict

      - name: Install smoke test (dependency auto-install)
        run: bash scripts/test-install.sh

      - name: Run shellcheck
        run: shellcheck scripts/*.sh skills/*/scripts/*.sh

      - name: Run ruff
        run: |
          python3 -m pip install --disable-pip-version-check --requirement requirements-dev.txt
          ruff check skills evals

      - name: Run actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
