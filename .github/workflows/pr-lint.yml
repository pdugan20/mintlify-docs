name: PR Lint

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate semantic pull request title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        with:
          # Type must match [a-zA-Z]+ — no hyphens. The conventional-commits
          # parser rejects hyphenated types regardless of this allowlist, so
          # Dependabot is configured to use `chore(deps)` / `chore(deps-dev)`
          # (hyphen lives in the scope, which is fine).
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            deps
            revert
          requireScope: false
          subjectPattern: ^[a-z].*$
          subjectPatternError: |
            The subject must start with a lowercase letter.
            Example: "feat: add eval harness for skill triggering"
        env:
          GITHUB_TOKEN: ${{ github.token }}
