name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG.md
        run: |
          # Extract the section for this version (between first and second ## heading)
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          awk -v ver="$VERSION" '
            /^## \[?[0-9]/ { if (found) exit; if (index($0, ver)) found=1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md

      # Bundle .claude-plugin/ + skills/ + references/ into
      # mintlify-docs-plugin.zip and attach it to the release so users can
      # trial the plugin via `claude --plugin-url` without registering the
      # marketplace.
      - name: Package plugin archive
        run: bash scripts/package-plugin.sh

      - name: Create GitHub Release
        run: |
          # A pre-release tag (e.g. v1.2.3-beta.0) must be flagged so it
          # does not become "latest" — trial installs point at
          # /releases/latest/download/mintlify-docs-plugin.zip.
          PRERELEASE=
          case "${{ github.ref_name }}" in *-*) PRERELEASE=--prerelease ;; esac
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file release-notes.md $PRERELEASE mintlify-docs-plugin.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
