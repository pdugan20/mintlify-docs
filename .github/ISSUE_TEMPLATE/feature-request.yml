name: Feature request
description: Propose a new skill, a playbook rule, or an enhancement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What documentation task is manual, inconsistent, or error-prone today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the plugin do? If it is an editorial rule, which best-practices section does it extend?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Does the official mintlify plugin already cover part of this? (This plugin layers on it and avoids duplicating mechanics.)
